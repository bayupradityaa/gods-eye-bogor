<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/webp" href="/Kujang.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Live CCTV monitoring platform for Kota Bogor - Real-time city surveillance" />
  <meta name="keywords" content="CCTV, Bogor, live monitoring, city surveillance, public cameras" />
  <meta property="og:title" content="Bogor Live - CCTV Kota Bogor" />
  <meta property="og:description" content="Pantau kondisi Kota Bogor secara langsung melalui jaringan kamera publik." />
  <meta property="og:image" content="/og-image.png" />
  <meta name="theme-color" content="#F7F8FA" />
  <title>A live window into Bogor.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet" />
  <!-- Anti-flicker: apply theme before any render -->
  <script>
    (function () {
      var t = localStorage.getItem('bogor-live-theme');
      if (t !== 'light' && t !== 'dark') t = 'light';
      document.documentElement.setAttribute('data-theme', t);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t === 'dark' ? '#07090D' : '#F7F8FA');
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
